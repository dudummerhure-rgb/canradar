name: Angebote aktualisieren
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update_deals.py
      - name: Speichern
        run: |
          git config user.name "canradar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add deals.json
          git diff --staged --quiet || (git commit -m "Angebote aktualisiert" && git push)
